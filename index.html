<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Priyadarshini Bus Rush</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

  <!-- SCORE BAR -->
  <div class="topbar">
    <span>🏆 <b id="score">0</b></span>
    <span>🪙 <b id="coins">0</b></span>
    <span>📏 <b id="distance">0</b>m</span>
  </div>


  <!-- GAME ROAD -->
  <div id="road">

    <!-- Kerala scenery -->
    <div class="tree tree1">🌴</div>
    <div class="tree tree2">🌴</div>
    <div class="tree tree3">🌴</div>
    <div class="tree tree4">🌴</div>

    <div class="house house1">🏠</div>
    <div class="house house2">🏠</div>


    <!-- Road markings -->
    <div class="road-line line1"></div>
    <div class="road-line line2"></div>
    <div class="road-line line3"></div>
    <div class="road-line line4"></div>


    <!-- ENEMY VEHICLE -->
    <div id="obstacle">🚗</div>

    <!-- COIN -->
    <div id="coin">🪙</div>


    <!-- PRIYADARSHINI BUS -->
    <div id="bus">

      <div class="bus-roof">
        PRIYADARSHINI
      </div>

      <div class="bus-windows">

        <div class="window">
          👩
        </div>

        <div class="window">
          👩
        </div>

        <div class="window">
          👩
        </div>

      </div>

      <div class="bus-body-text">
        KSRTC
      </div>

      <div class="bus-front">

        <div class="headlight"></div>

        <div class="headlight"></div>

        <div class="bumper"></div>

      </div>

      <div class="wheel wheel-left"></div>
      <div class="wheel wheel-right"></div>

    </div>

  </div>


  <!-- CONTROLS -->
  <div class="controls">

    <button id="left">⬅️</button>

    <button id="start">
      START
    </button>

    <button id="right">➡️</button>

  </div>


  <div id="message">
    Tap START to play
  </div>

</div>

<script src="game.js"></script>

</body>
</html>
