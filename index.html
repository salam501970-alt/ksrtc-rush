<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priyadarshini Bus Rush</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <div class="topbar">
      <div>🏆 Score: <span id="score">0</span></div>
      <div>🪙 Coins: <span id="coins">0</span></div>
      <div>📏 <span id="distance">0</span> m</div>
    </div>

    <div id="road">

      <div class="cloud cloud1">☁️</div>
      <div class="cloud cloud2">☁️</div>

      <div class="road-line line1"></div>
      <div class="road-line line2"></div>
      <div class="road-line line3"></div>

      <div id="bus">

        <div class="bus-front">
          <div class="bus-light"></div>
          <div class="bus-light"></div>
        </div>

        <div class="bus-window">
          👩 👩 👩
          <br>
          👩 👩 👩
        </div>

        <div class="bus-name">
          PRIYADARSHINI
        </div>

        <div class="bus-wheel wheel1"></div>
        <div class="bus-wheel wheel2"></div>

      </div>

      <div id="obstacle">🚗</div>

      <div id="coin">🪙</div>

    </div>

    <div class="controls">
      <button id="left">⬅️</button>
      <button id="start">START</button>
      <button id="right">➡️</button>
    </div>

    <div id="message">
      Tap START to play
    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
